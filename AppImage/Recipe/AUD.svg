<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <circle id="blue-circle" cx="32" cy="24" r="18" />
    <circle id="yellow-circle" cx="32" cy="40" r="18" />
    <circle id="blue-eye" cx="22" cy="46" r="4" />
    <circle id="yellow-eye" cx="42" cy="18" r="4" />
    <text id="name-letters" x="32" y="35" text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="11" font-weight="bold">A U D</text>
    <circle id="top-edge" cx="32" cy="24" r="18" />
    <circle id="bottom-edge" cx="32" cy="40" r="18" />
    <clipPath id="intersection">
      <use href="#blue-circle" />
    </clipPath>
  </defs>
  <use href="#blue-circle" fill="#3776AB" />
  <use href="#yellow-circle" fill="#FFD43B" />
  <use href="#blue-eye" fill="#3776AB" />
  <use href="#yellow-eye" fill="#FFD43B" />
  <use href="#top-edge" fill="none" stroke="#555555" stroke-width="2" />
  <use href="#bottom-edge" fill="none" stroke="#555555" stroke-width="2" />
  <use href="#yellow-circle" fill="#555555" clip-path="url(#intersection)" />
  <use href="#name-letters" fill="white" />
</svg>
